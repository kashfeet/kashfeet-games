<!DOCTYPE html>
<html>
<head>
    <title>Kashfeet Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #e8e8e8;
            min-height: 100vh;
        }
        nav {
            display: flex;
            gap: 30px;
            padding: 20px 40px;
            background: #111;
            border-bottom: 1px solid #222;
        }
        nav a {
            color: #888;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        nav a:hover { color: #fff; }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 40px;
        }
        h1 {
            font-size: 40px;
            margin-bottom: 20px;
            color: #fff;
        }
        p { color: #aaa; line-height: 1.6; margin-bottom: 20px; }
        .game-card {
            display: block;
            background: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            text-decoration: none;
            color: #fff;
            transition: border-color 0.2s;
        }
        .game-card:hover { border-color: #444; }
        iframe {
            width: 100%;
            height: 600px;
            border: 1px solid #222;
            border-radius: 12px;
            background: #000;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/games">Games</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
